name: Set up Gradle
description: Install the Java toolchains used by SoftConfig and configure Gradle.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 8
    - shell: bash
      run: echo "SOFTCONFIG_JAVA_8_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 21
    - shell: bash
      run: echo "SOFTCONFIG_JAVA_21_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 25
    - shell: bash
      run: echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=${SOFTCONFIG_JAVA_8_HOME},${SOFTCONFIG_JAVA_21_HOME},${JAVA_HOME}" >> "${GITHUB_ENV}"
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
