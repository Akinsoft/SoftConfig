name: Publish Skysoft Maven

on:
  push:
    branches:
      - skysoft
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build Maven artifacts
        run: |
          ./gradlew --no-daemon \
            :common:test \
            :common:publishToMavenLocal \
            :modern:modern-26.1:publishToMavenLocal \
            :modern:modern-26.2:publishToMavenLocal \
            --stacktrace

      - name: Collect Maven artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep '^moulconfig.publishVersion=' gradle.properties | cut -d= -f2)"
          group="$(grep '^moulconfig.publishGroup=' gradle.properties | cut -d= -f2)"
          group_path="${group//./\/}"
          output="build/skysoft-maven/${group_path}"

          mkdir -p "${output}"
          for module in common modern-26.1 modern-26.2; do
            source_dir="${HOME}/.m2/repository/${group_path}/${module}/${version}"
            if [[ ! -d "${source_dir}" ]]; then
              echo "Missing published artifact directory: ${source_dir}" >&2
              exit 1
            fi

            mkdir -p "${output}/${module}"
            cp -R "${source_dir}" "${output}/${module}/"

            metadata="${HOME}/.m2/repository/${group_path}/${module}/maven-metadata-local.xml"
            if [[ -f "${metadata}" ]]; then
              cp "${metadata}" "${output}/${module}/maven-metadata.xml"
            fi
          done

      - name: Publish Maven repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/skysoft-maven
          destination_dir: maven
          keep_files: true
