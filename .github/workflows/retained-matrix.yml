name: Retained Version Matrix

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-build:
    name: retained-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - legacy
          - modern:modern-1.21.4
          - modern:modern-1.21.5
          - modern:modern-1.21.7
          - modern:modern-1.21.10
          - modern:modern-1.21.11
          - modern:modern-26.1
          - modern:modern-26.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew ":${{ matrix.target }}:build"
